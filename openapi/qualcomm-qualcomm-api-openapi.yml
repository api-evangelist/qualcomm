openapi: 3.1.0
info:
  title: Qualcomm Developer API
  description: >-
    Qualcomm provides developer APIs and SDKs for mobile computing, 5G connectivity, AI inference, and IoT. The platform supports developers building applications for Snapdragon-powered devices.
  version: '1.0'
  contact:
    name: Qualcomm Developer Support
    url: https://developer.qualcomm.com/
externalDocs:
  description: Documentation
  url: https://developer.qualcomm.com/
servers:
  - url: https://developer.qualcomm.com/api
    description: Production
tags:
  - name: Semiconductors
    description: Semiconductors operations
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get API status
      description: >-
        Returns the current status of the API.
      tags:
        - Semiconductors
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '429':
          description: Too many requests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
