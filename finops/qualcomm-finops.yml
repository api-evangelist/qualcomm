notes: Qualcomm does not publish a per-API meter or invoice surface for its developer SDKs; the company's
  revenue is principally chipset and licensing rather than API metering. FinOps mapping is left at the
  partner-program contract level.
description: FinOps for the Qualcomm developer surface is not metered per-API; consumption is governed
  by Qualcomm Developer Network registration and partner-program contracts rather than by FOCUS-shaped
  invoices.
