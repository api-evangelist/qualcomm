meters:
  - name: program_engagement
    description: Partner-program or licensing engagement under the Qualcomm Developer Network.
    unit: varies
    aggregation: sum
    dimensions:
      - program
principles:
  - name: Visibility
    description: Surface Qualcomm Developer Network entitlements through internal procurement records;
      the developer portal does not expose a usage-meter API.
  - name: Allocation
    description: Allocate program fees and licensing costs to the device-engineering or product-platform
      cost centers that consume the SDKs and AI Hub access.
  - name: Optimization
    description: Optimization happens at program renewal; consolidate developer accounts under the appropriate
      program tier and avoid duplicate registrations.
  - name: Accountability
    description: Engineering leadership owns Qualcomm Developer Network entitlements; route program
      changes through the Qualcomm account team.
